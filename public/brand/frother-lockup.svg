  <rect x="358" y="58" width="44" height="14" rx="2" fill="#1A1A1A"/>

  <!-- R -->
  <rect x="408" y="0"  width="14" height="72" rx="2" fill="#1A1A1A"/>
  <rect x="408" y="0"  width="48" height="14" rx="2" fill="#1A1A1A"/>
