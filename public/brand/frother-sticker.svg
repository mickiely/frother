<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260" role="img" aria-label="Frother NFC counter sticker">
  <title>Frother — Tap in. Stack stamps. Froth on.</title>

  <!-- ── Background ────────────────────────────────────────────────────────── -->
  <rect width="440" height="260" rx="20" fill="#F7F3EA"/>
  <!-- Border (matches frother-card CSS: border-color #111827, 2px) -->
  <rect x="2" y="2" width="436" height="256" rx="19" fill="none"
        stroke="#111827" stroke-width="3"/>
  <!-- Bottom shadow bar (matches frother-card box-shadow) -->
  <rect x="7" y="257" width="430" height="6" rx="3" fill="rgba(17,24,39,0.14)"/>

  <!-- ── FROTHER wordmark (green) ───────────────────────────────────────────
       Scaled to 46px tall: scale = 46/72 = 0.639
       Width = 364 × 0.639 = 232.5 → 233
       Centred in 440: left = (440 - 233) / 2 = 103.5
       Using transform="translate(103.5, 28) scale(0.639)"                  -->
  <g transform="translate(103.5, 28) scale(0.639)" fill="#16A34A">
    <rect x="0"   y="0"  width="14" height="72" rx="2"/>
    <rect x="0"   y="0"  width="44" height="14" rx="2"/>
    <rect x="0"   y="29" width="37" height="14" rx="2"/>
    <rect x="50"  y="0"  width="14" height="72" rx="2"/>
    <rect x="50"  y="0"  width="48" height="14" rx="2"/>
    <rect x="84"  y="0"  width="14" height="44" rx="2"/>
    <rect x="50"  y="30" width="48" height="14" rx="2"/>
    <polygon points="64,44 78,44 98,72 84,72"/>
    <path fill-rule="evenodd" d="M104,0 H152 V72 H104 Z  M117,13 H139 V59 H117 Z"/>
    <rect x="158" y="0"  width="48" height="14" rx="2"/>
    <rect x="175" y="0"  width="14" height="72" rx="2"/>
    <rect x="212" y="0"  width="14" height="72" rx="2"/>
    <rect x="246" y="0"  width="14" height="72" rx="2"/>
    <rect x="212" y="29" width="48" height="14" rx="2"/>
    <rect x="266" y="0"  width="14" height="72" rx="2"/>
    <rect x="266" y="0"  width="44" height="14" rx="2"/>
    <rect x="266" y="29" width="38" height="14" rx="2"/>
    <rect x="266" y="58" width="44" height="14" rx="2"/>
    <rect x="316" y="0"  width="14" height="72" rx="2"/>
    <rect x="316" y="0"  width="48" height="14" rx="2"/>
    <rect x="350" y="0"  width="14" height="44" rx="2"/>
    <rect x="316" y="30" width="48" height="14" rx="2"/>
    <polygon points="330,44 344,44 364,72 350,72"/>
  </g>

  <!-- ── Divider ────────────────────────────────────────────────────────────  -->
  <line x1="28" y1="104" x2="412" y2="104" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ── F icon mark (left of tagline) ─────────────────────────────────────
       48 × 48 icon, centred vertically in lower section (y=104 to y=240, centre=172)
       Icon top = 172 - 24 = 148                                             -->
  <rect x="28" y="148" width="48" height="48" rx="10" fill="#16A34A"/>
  <rect x="29.5" y="149.5" width="45" height="45" rx="9" fill="none"
        stroke="#111827" stroke-width="2.5"/>
  <!-- F in icon: area 26×36, offset (11, 6) from icon top-left, stroke=8 -->
  <rect x="39"  y="154" width="8" height="36" rx="1.5" fill="#FFF8EA"/>
  <rect x="39"  y="154" width="26" height="8" rx="1.5" fill="#FFF8EA"/>
  <rect x="39"  y="169" width="21" height="8" rx="1.5" fill="#FFF8EA"/>

  <!-- ── Tagline ────────────────────────────────────────────────────────────
       Three lines right of the icon. Font is system bold; venue owners who
       want exact brand output should convert to outlines in Illustrator.    -->
  <text x="90" y="156"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="800"
        font-size="22"
        fill="#111827"
        letter-spacing="-0.5">Tap in.</text>

  <text x="90" y="183"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="800"
        font-size="22"
        fill="#111827"
        letter-spacing="-0.5">Stack stamps.</text>

  <text x="90" y="210"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="800"
        font-size="22"
        fill="#16A34A"
        letter-spacing="-0.5">Froth on.</text>

  <!-- ── NFC tap waves (bottom-right corner) ───────────────────────────────
       Three expanding arcs radiating right from a centre dot.
       Centre at (396, 226).                                                 -->
  <circle cx="364" cy="226" r="4" fill="#111827"/>
  <!-- Arc 1: r=10 -->
  <path d="M364,-10 A10,10 0 0,1 364,10"
        transform="translate(0,226)"
        fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arc 2: r=18 -->
  <path d="M364,-18 A18,18 0 0,1 364,18"
        transform="translate(0,226)"
        fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arc 3: r=27 -->
  <path d="M364,-27 A27,27 0 0,1 364,27"
        transform="translate(0,226)"
        fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ── Small print ────────────────────────────────────────────────────────  -->
  <text x="220" y="246"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="600"
        font-size="11"
        fill="#111827"
        opacity="0.35"
        text-anchor="middle"
        letter-spacing="0.5">frother.app</text>
</svg>
