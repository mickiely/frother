<!DOCTYPE html>
<html lang="en">
  <body>
    <form name="frother-pilot" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="frother-pilot" />
      <input name="bot-field" />
      <input name="venue-name" />
      <input name="contact-name" />
      <input name="mobile" />
      <input name="email" />
      <select name="venue-type">
        <option value="Cafe">Cafe</option>
        <option value="Pub">Pub</option>
        <option value="Restaurant">Restaurant</option>
        <option value="Takeaway">Takeaway</option>
        <option value="Other">Other</option>
      </select>
      <input name="suburb" />
      <select name="current-loyalty-setup">
        <option value="Paper stamp cards">Paper stamp cards</option>
        <option value="Square Loyalty">Square Loyalty</option>
        <option value="Lightspeed / POS loyalty">Lightspeed / POS loyalty</option>
        <option value="No loyalty setup">No loyalty setup</option>
        <option value="Other">Other</option>
      </select>
      <input name="biggest-problem" />
      <textarea name="notes"></textarea>
    </form>
  </body>
</html>
